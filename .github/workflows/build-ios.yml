name: Build iOS (.ipa)

# GitHub → Actions → "Build iOS (.ipa)" → "Run workflow". Builds with
# `eas build --local` on a GitHub macOS runner, so it uses NO EAS build credits,
# and publishes the result as a GitHub Release.
#
# WHY macOS AND NOT ubuntu: Xcode only runs on macOS, so unlike
# build-android.yml this cannot use the free Ubuntu runner. On a PRIVATE repo
# GitHub bills macOS minutes at a 10x multiplier — budget roughly 4-6 builds a
# month on the free plan. On a public repo standard macOS runners are free.
#
# PREREQUISITE, one time, and it cannot be done from CI. Run
#
#   eas build --platform ios --profile production
#
# once from a Mac and answer the Apple login and 2FA prompts. That generates the
# distribution certificate and provisioning profile and stores them on EAS; this
# workflow then fetches them non-interactively with EXPO_TOKEN. Without it the
# build here fails with a credentials error.
#
# Pick a profile:
#   • production → .ipa signed for the App Store. CANNOT be installed directly
#                  on a phone — it goes through TestFlight.
#   • preview    → ad-hoc .ipa that installs straight onto iPhones whose UDID
#                  is registered with `eas device:create`.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        type: choice
        options:
          - production
          - preview
        default: production
      submit:
        description: "Upload to TestFlight after building (production only)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    # Needed to publish the build as a GitHub Release asset.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version in use
        run: xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache CocoaPods (reuse downloaded pod sources across runs)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('**/package-lock.json', 'app.json', 'eas.json') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      # Credentials are NOT generated here — they are pulled from EAS using
      # EXPO_TOKEN. See the PREREQUISITE note at the top.
      - name: Build (local — free, no EAS credits)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --local \
            --platform ios \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --output "${{ github.workspace }}/app-release.ipa"

      # A GitHub RELEASE, not an artifact — release assets do not count against
      # the 500 MB Actions artifact quota. Same reasoning as the Android job.
      - name: Publish build to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-${{ inputs.profile }}-${{ github.run_number }}"
          gh release create "$TAG" \
            "app-release.ipa" \
            --title "iOS ${{ inputs.profile }} build #${{ github.run_number }}" \
            --notes "Automated \`eas build --local\` output. Download the .ipa below." \
            --prerelease

      # Requires an App Store Connect API key stored on EAS (`eas credentials`
      # → iOS → App Store Connect API Key). Skipped unless the box is ticked.
      - name: Submit to TestFlight
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --platform ios \
            --path "${{ github.workspace }}/app-release.ipa" \
            --non-interactive
